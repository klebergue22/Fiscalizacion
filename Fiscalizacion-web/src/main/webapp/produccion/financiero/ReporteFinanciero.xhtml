<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
   <h:head>
     
        <link href="#{facesContext.externalContext.context.contextPath}/css/default.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/report-growl.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/tableLayout.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/cssLayout.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/font-awesome.min.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/fonts.googleapis.com.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/ace.min.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/ace-rtl.min.css" rel="stylesheet" type="text/css" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
     
    </h:head>
<h:body>
<script type="text/javascript">
    //<![CDATA[
    function start() {
        window['progress'] = setInterval(function() {
    var pbClient = PF('pbClient'),
    oldValue = pbClient.getValue(),
    newValue = oldValue + 10;

    pbClient.setValue(pbClient.getValue() + 10);

    if(newValue === 100) {
        clearInterval(window['progress']);
    }
        }, 1000);
    }

    function cancel() {
        clearInterval(window['progress']);
        PF('pbClient').setValue(0);
        PF('startButton1').enable();
    }
    //]]>
    </script>
    <p:dialog modal="true" widgetVar="statusDialog"
              header="Por favor espere..."
              draggable="false" closable="false" resizable="false"
              appendTo="@(body)"
              styleClass="loading-dialog" width="350">
        <div style="text-align:center; padding:20px;">
            <h:graphicImage library="images" name="loading.gif"
                            alt="Cargando..." style="display:block;margin:0 auto;"/>
            <h:outputText value="Procesando..." style="font-weight:bold;margin-top:8px;"/>
            <p>Procesando su solicitud...</p>
        </div>
    </p:dialog>
   <p:panel style="font-size: larger;font-weight: bold; color: #004085" class="form-group col-lg-12 col-md-12 col-sm-12 col-xs-12">
        
        <h:form id="frmFinanciero">
            <p:growl id="msgs" styleClass="report-growl" style="position: fixed; top: 95px; right: 30px; width: 390px; z-index: 99999;" showSummary="false" showDetail="true" life="6000" />
            
            <div class="form-group col-md-12">
                <p:outputLabel value="Fecha Desde: " class=" col-lg-1 col-md-1 control-label"/>      
                <div class="col-lg-3 col-md-3">
                    <p:calendar id="cldFecha" value="#{reporteFinancieroControlador.fechaDesde}" pattern="#{formato.formatoFecha}" placeholder="dd/mm/yyyy"/>
                </div>               
            
                <p:outputLabel value="Fecha Hasta: " class=" col-lg-1 col-md-1 control-label"/>      
                <div class="col-lg-3 col-md-3">
                    <p:calendar id="cldFecha2" value="#{reporteFinancieroControlador.fechaHasta}" pattern="#{formato.formatoFecha}" placeholder="dd/mm/yyyy"/>
                </div>               
                
                <p:outputLabel value="Fecha Corte: " class=" col-lg-1 col-md-1 control-label"/>      
                <div class="col-lg-3 col-md-3">
                    <p:calendar id="cldFecha3" value="#{reporteFinancieroControlador.fechaCorte}" pattern="#{formato.formatoFecha}" placeholder="dd/mm/yyyy"/>
                </div>               
   
            </div>     

            <p:commandButton value="Generar Reporte" class="btn-xs btn btn-info" 
                             update="frmFinanciero" process="@all"
                             actionListener="#{reporteFinancieroControlador.generarReporteFinanciero()}" onclick="PF('statusDialog').show(); start()" oncomplete="PF('statusDialog').hide(); cancel()" widgetVar="startButton1"  />

            <br /><br />
            <p:progressBar id="progressBarClient" widgetVar="pbClient" style=" font-size: small" labelTemplate="Cargando........Por favor espere"  />
            <p:commandButton value="Descargar Excel"
                             class="btn-xs btn btn-success"
                             ajax="false"
                             rendered="#{reporteFinancieroControlador.media ne null}">
                <p:fileDownload value="#{reporteFinancieroControlador.archivoDescargaExcel}"/>
            </p:commandButton>
            <p:media class="form-group col-lg-12 col-md-12 col-sm-12 col-xs-12" cache="false" rendered="#{reporteFinancieroControlador.media ne null}" width="1400" height="800" value="#{reporteFinancieroControlador.media}" player="pdf"/>
  
        </h:form>
      </p:panel>
    

    <p:ajaxStatus
        onstart="try{PF('statusDialog').show();}catch(e){}"
        onsuccess="try{PF('statusDialog').hide();}catch(e){}"
        onerror="try{PF('statusDialog').hide();}catch(e){}"/>
</h:body>
</html>
