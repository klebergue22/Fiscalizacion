<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
   <h:head>
     
        <link href="#{facesContext.externalContext.context.contextPath}/css/default.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/report-growl.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/tableLayout.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/cssLayout.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/font-awesome.min.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/fonts.googleapis.com.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/ace.min.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/ace-rtl.min.css" rel="stylesheet" type="text/css" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
     
    </h:head>
<h:body>
    <p:dialog modal="true" widgetVar="statusDialog"
              header="Por favor espere..."
              draggable="false" closable="false" resizable="false"
              appendTo="@(body)"
              styleClass="loading-dialog" width="350">
        <div style="text-align:center; padding:20px;">
            <h:graphicImage library="images" name="loading.gif"
                            alt="Cargando..." style="display:block;margin:0 auto;"/>
            <h:outputText value="Procesando..." style="font-weight:bold;margin-top:8px;"/>
            <p>Procesando su solicitud...</p>
        </div>
    </p:dialog>
<script type="text/javascript">
    //<![CDATA[
    function start() {
        var pbClient = PF('pbClient');
        if (pbClient) {
            pbClient.setValue(0);
            if (pbClient.jq) {
                pbClient.jq.show();
            }
            window['progress'] = setInterval(function() {
                var newValue = pbClient.getValue() + 10;
                pbClient.setValue(newValue >= 100 ? 90 : newValue);
            }, 1000);
        }
    }

    function cancel() {
        clearInterval(window['progress']);
        var pbClient = PF('pbClient');
        if (pbClient) {
            pbClient.setValue(0);
            if (pbClient.jq) {
                pbClient.jq.hide();
            }
        }
        var startButton = PF('startButton');
        if (startButton) {
            startButton.enable();
        }
    }
    function iniciarDescargaReporte() {
        try {
            PF('statusDialog').show();
        } catch (e) {}
    }

    function finalizarDescargaReporte() {
        try {
            PF('statusDialog').hide();
        } catch (e) {}
        try {
            cancel();
        } catch (e) {}
    }
    //]]>
    </script>
 
   <p:panel style="font-size: larger;font-weight: bold; color: #004085" class="form-group col-lg-12 col-md-12 col-sm-12 col-xs-12">
        
        <h:form id="frmAtrasos">
            <p:growl id="msgs" styleClass="report-growl" style="position: fixed; top: 95px; right: 30px; width: 390px; z-index: 99999;" showSummary="false" showDetail="true" life="6000" />            
            
            <div class="form-group col-md-12">
                <p:outputLabel value="Todos:" class=" col-lg-1 col-md-1 control-label" />
                <div class="col-lg-1 col-md-1">
                    <p:selectBooleanCheckbox value="#{reporteAtrasoControlador.todasGestiones}">
                        <p:ajax update="idGestion" />
                    </p:selectBooleanCheckbox>
                </div>
                <p:outputLabel value="Gestiones:" class=" col-lg-1 col-md-1 control-label" />
                <div class="col-lg-3 col-md-3">
                    <p:selectOneMenu  id="idGestion"
                                      value="#{reporteAtrasoControlador.noGestion}"
                                      required="#{not reporteAtrasoControlador.todasGestiones}"
                                      requiredMessage="DEBE SELECCIONAR LA GESTION"
                                      disabled="#{reporteAtrasoControlador.todasGestiones}"
                                      filter="true"
                                      filterMatchMode="contains" >
                        <f:selectItem itemLabel="-- Seleccione la Gestión --" noSelectionOption="true"/>
                        <f:selectItems value="#{reporteAtrasoControlador.listadoGestiones}" var="itemGestion"
                                       itemLabel="#{itemGestion.descrip}"
                                       itemValue="#{itemGestion.noCd}" />                           
                    </p:selectOneMenu>
                </div>
            </div>            
            <div class="form-group col-md-12">
                <p:outputLabel value="Fecha Desde: " class=" col-lg-1 col-md-1 control-label"/>      
                <div class="col-lg-3 col-md-3">
                    <p:calendar id="cldFecha" value="#{reporteAtrasoControlador.fechaDesde}" pattern="#{formato.formatoFecha}" placeholder="dd/mm/yyyy" navigator="true" yearRange="1928:2035" mask="true" showButtonPanel="true"/>
                </div>     
            
                <p:outputLabel value="Fecha Hasta: " class=" col-lg-1 col-md-1 control-label"/>      
                <div class="col-lg-3 col-md-3">
                    <p:calendar id="cldFecha2" value="#{reporteAtrasoControlador.fechaHasta}" pattern="#{formato.formatoFecha}" placeholder="dd/mm/yyyy" navigator="true" yearRange="1928:2035" mask="true" showButtonPanel="true"/>
                </div>               
            </div>     

            <p:commandButton value="Generar Reporte" class="btn-xs btn btn-info" 
                             update=":frmAtrasos" process="@all"
                             actionListener="#{reporteAtrasoControlador.generarReporteAtrasos()}" onclick="PF('statusDialog').show(); start()" oncomplete="PF('statusDialog').hide(); cancel()" widgetVar="startButton"  />

            <br /><br />
            <p:progressBar id="progressBarClient" widgetVar="pbClient" style="display:none; font-size: small" labelTemplate="Cargando........Por favor espere"  />
            <p:commandButton value="Descargar PDF"
                             class="btn-xs btn btn-primary"
                             onclick="PrimeFaces.monitorDownload(iniciarDescargaReporte, finalizarDescargaReporte)"
                             ajax="false"
                             rendered="#{reporteAtrasoControlador.media ne null}">
                <p:fileDownload value="#{reporteAtrasoControlador.archivoDescarga}"/>
            </p:commandButton>
            <p:commandButton value="Descargar Excel"
                             class="btn-xs btn btn-success"
                             onclick="PrimeFaces.monitorDownload(iniciarDescargaReporte, finalizarDescargaReporte)"
                             ajax="false"
                             rendered="#{reporteAtrasoControlador.media ne null}">
                <p:fileDownload value="#{reporteAtrasoControlador.archivoDescargaExcel}"/>
            </p:commandButton>
            <p:media class="form-group col-lg-12 col-md-12 col-sm-12 col-xs-12" cache="false" rendered="#{reporteAtrasoControlador.media ne null}" width="1400" height="800" value="#{reporteAtrasoControlador.media}" player="pdf"/>
  
        </h:form>
      </p:panel>
    


    <p:ajaxStatus
        onstart="try{PF('statusDialog').show();}catch(e){}"
        onsuccess="try{PF('statusDialog').hide();}catch(e){}"
        onerror="try{PF('statusDialog').hide();}catch(e){}"/>
</h:body>
</html>
