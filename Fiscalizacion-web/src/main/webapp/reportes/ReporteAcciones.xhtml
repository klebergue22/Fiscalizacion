<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
   <h:head>
     
        <link href="#{facesContext.externalContext.context.contextPath}/css/default.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/report-growl.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/tableLayout.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/cssLayout.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/font-awesome.min.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/fonts.googleapis.com.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/ace.min.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/ace-rtl.min.css" rel="stylesheet" type="text/css" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
     
    </h:head>
<h:body>
    <p:dialog modal="true" widgetVar="statusDialog"
              header="Por favor espere..."
              draggable="false" closable="false" resizable="false"
              appendTo="@(body)"
              styleClass="loading-dialog" width="350">
        <div style="text-align:center; padding:20px;">
            <h:graphicImage library="images" name="loading.gif"
                            alt="Cargando..." style="display:block;margin:0 auto;"/>
            <h:outputText value="Procesando..." style="font-weight:bold;margin-top:8px;"/>
            <p>Procesando su solicitud...</p>
        </div>
    </p:dialog>
    
    <script type="text/javascript">
    //<![CDATA[
    function start() {
        var pbClient = PF('pbClient');
        if (pbClient) {
            pbClient.setValue(0);
            if (pbClient.jq) {
                pbClient.jq.show();
            }
            window['progress'] = setInterval(function() {
                var newValue = pbClient.getValue() + 10;
                pbClient.setValue(newValue >= 100 ? 90 : newValue);
            }, 1000);
        }
    }

    function cancel() {
        clearInterval(window['progress']);
        var pbClient = PF('pbClient');
        if (pbClient) {
            pbClient.setValue(0);
            if (pbClient.jq) {
                pbClient.jq.hide();
            }
        }
        var startButton = PF('startButton');
        if (startButton) {
            startButton.enable();
        }
    }
    function iniciarDescargaReporte() {
        try {
            PF('statusDialog').show();
        } catch (e) {}
        window.setTimeout(function() {
            finalizarDescargaReporte();
        }, 10000);
    }

    function finalizarDescargaReporte() {
        try {
            PF('statusDialog').hide();
        } catch (e) {}
        try {
            cancel();
        } catch (e) {}
    }
    //]]>
    </script>
    
    
   <p:panel  style="font-size: larger;font-weight: bold; color: #004085" class="form-group col-lg-12 col-md-12 col-sm-12 col-xs-12">
        
        <h:form id="repAcciones">
            
             <p:growl id="msgs" styleClass="report-growl" style="position: fixed; top: 95px; right: 30px; width: 390px; z-index: 99999;" showSummary="false" showDetail="true" life="6000" />
             
             <div class="form-group col-md-12">
                 <h:panelGrid id="panelMenu" columns="2">  

                     <p:outputLabel value="Empleado:" for="empleado" />
                     <p:autoComplete id="empleado"
                                     value="#{reporteAccionPerControlador.idEmpleado}"
                                     completeMethod="#{reporteAccionPerControlador.completarEmpleados}"
                                     var="itemEmp"
                                     itemLabel="#{reporteAccionPerControlador.obtenerEtiquetaEmpleado(itemEmp)}"
                                     itemValue="#{itemEmp.noPersona}"
                                     dropdown="true"
                                     forceSelection="true"
                                     minQueryLength="2"
                                     maxResults="20"
                                     scrollHeight="250"
                                     placeholder="Buscar empleado"
                                     emptyMessage="No se encontraron empleados"
                                     style="width: 506px"
                                     inputStyle="width: 470px">
                         <p:ajax event="itemSelect" listener="#{reporteAccionPerControlador.handleFacturaChange()}" process="@this" update=":repAcciones:dtMenu"/>
                     </p:autoComplete>
                 </h:panelGrid>
            </div>    
             
            <div class="form-group col-md-12">     
                 <p:dataTable id="dtMenu" value="#{reporteAccionPerControlador.listaAcciones}" var="itemAccion"
                              paginator="true" paginatorPosition="bottom" rows="4" style="width:80%">

                     <p:column style="width:40px">
                         <f:facet name="header">
                             <h:outputText value="Empleado" />
                         </f:facet>
                         <h:outputText value="#{itemAccion.nombreC}" />
                     </p:column>
                     <p:column style="width:20px; text-align: center">
                         <f:facet name="header">
                             <h:outputText value="Fecha Resolución" />
                         </f:facet>
                         <h:outputText value="#{itemAccion.fechaResolucion}">
                             <f:convertDateTime pattern="dd/MM/yyyy" />
                         </h:outputText>
                     </p:column>
                     <p:column style="width:20px; text-align: center">
                         <f:facet name="header">
                             <h:outputText value="Fecha Rige" />
                         </f:facet>
                         <h:outputText value="#{itemAccion.fechaRige}">
                             <f:convertDateTime pattern="dd/MM/yyyy" />
                         </h:outputText>
                     </p:column>
                     <p:column style="width:15px; text-align: center" >
                         <f:facet name="header">
                             <h:outputText value="Nro. Acción" />
                         </f:facet>
                         <h:outputText value="#{itemAccion.noAccion}" />
                     </p:column>
                 </p:dataTable>
            </div>           
                                
            <div class="form-group col-md-12">
                <p:outputLabel value="Número Acción: " class=" col-lg-1 col-md-1 control-label"/>    
                <div class="col-md-6">
                    <p:inputNumber id="valorcert" value="#{reporteAccionPerControlador.codigo}" title="codigo" placeholder="Ingrese la acción" inputStyle="width:20%" decimalPlaces="0" maxlength="4"  />
                </div>
            </div>
            <br /><br />
            
            <p:commandButton value="Generar Reporte" class="btn-xs btn btn-info" 
                             update=":repAcciones" process="@all"
                             actionListener="#{reporteAccionPerControlador.generateReport}" onclick="PF('statusDialog').show(); start()" oncomplete="PF('statusDialog').hide(); cancel()" widgetVar="startButton"  />
                        
            <br /><br />
            
             <p:progressBar id="progressBarClient" widgetVar="pbClient" style="display:none; font-size: small" labelTemplate="Cargando........Por favor espere"  />
             <p:commandButton value="Descargar PDF"
                             class="btn-xs btn btn-primary"
                             onclick="iniciarDescargaReporte()"
                             ajax="false"
                             rendered="#{reporteAccionPerControlador.media ne null}">
                <p:fileDownload value="#{reporteAccionPerControlador.archivoDescarga}"/>
            </p:commandButton>
            <p:commandButton value="Descargar Excel"
                             class="btn-xs btn btn-success"
                             onclick="iniciarDescargaReporte()"
                             ajax="false"
                             rendered="#{reporteAccionPerControlador.media ne null}">
                <p:fileDownload value="#{reporteAccionPerControlador.archivoDescargaExcel}"/>
            </p:commandButton>
            <p:media class="form-group col-lg-12 col-md-12 col-sm-12 col-xs-12" cache="false" rendered="#{reporteAccionPerControlador.media ne null}" width="1400" height="800" value="#{reporteAccionPerControlador.media}" player="pdf"/>
            
            
        </h:form>
      </p:panel>
    


    <p:ajaxStatus
        onstart="try{PF('statusDialog').show();}catch(e){}"
        onsuccess="try{PF('statusDialog').hide();}catch(e){}"
        onerror="try{PF('statusDialog').hide();}catch(e){}"/>
</h:body>
</html>
