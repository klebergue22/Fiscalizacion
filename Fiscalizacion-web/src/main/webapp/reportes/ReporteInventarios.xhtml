<?xml version="1.0" encoding="UTF-8"?>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
   <h:head>
     
        <link href="#{facesContext.externalContext.context.contextPath}/css/default.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/report-growl.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/tableLayout.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/cssLayout.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/font-awesome.min.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/fonts.googleapis.com.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/ace.min.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/ace-rtl.min.css" rel="stylesheet" type="text/css" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
     
    </h:head>
<h:body>
<script type="text/javascript">
    //<![CDATA[
    function start() {
        var pbClient = PF('pbClient');
        if (pbClient) {
            pbClient.setValue(0);
            if (pbClient.jq) {
                pbClient.jq.show();
            }
            window['progress'] = setInterval(function() {
                var newValue = pbClient.getValue() + 10;
                pbClient.setValue(newValue >= 100 ? 90 : newValue);
            }, 1000);
        }
    }

    function cancel() {
        clearInterval(window['progress']);
        var pbClient = PF('pbClient');
        if (pbClient) {
            pbClient.setValue(0);
            if (pbClient.jq) {
                pbClient.jq.hide();
            }
        }
        var startButton = PF('startButton');
        if (startButton) {
            startButton.enable();
        }
    }
    //]]>
    </script>
 
   <p:panel style="font-size: larger;font-weight: bold; color: #004085" class="form-group col-lg-12 col-md-12 col-sm-12 col-xs-12">
        
        <h:form id="frmInventarios">
            <p:growl id="msgs" styleClass="report-growl" style="position: fixed; top: 95px; right: 30px; width: 390px; z-index: 99999;" showSummary="false" showDetail="true" life="6000" />
            
            <div class="form-group col-md-12">  
                <p:outputLabel value="Periodo:" class=" col-md-1 control-label" />
                <div class="col-md-2">
                    <p:selectOneMenu  id="idperiodo" value="#{reporteInventariosControlador.idPeriodo}" >
                        <f:selectItem itemLabel="-- Seleccione Periodo --" noSelectionOption="true"/>
                        <f:selectItems value="#{reporteInventariosControlador.listaPeriodo}" var="itemPeriodo"
                                       itemLabel="#{itemPeriodo}"
                                       itemValue="#{itemPeriodo}" />                            
                    </p:selectOneMenu>
                </div>
            </div>
            
            <div class="form-group col-md-12">  
                <p:outputLabel value="Grupos:" class=" col-md-1 control-label" />
                <div class="col-md-2">
                    <p:selectOneMenu  id="idGrupo" value="#{reporteInventariosControlador.idGrupo}" >
                        <f:selectItem itemLabel="-- Seleccione Grupo --" noSelectionOption="true"/>
                        <f:selectItems value="#{reporteInventariosControlador.listaGruposArticulos}" var="itemGrupo"
                                       itemLabel="#{itemGrupo.descGrupo}   #{itemGrupo.idGrupo}"
                                       itemValue="#{itemGrupo.idGrupo}" />                            
                    </p:selectOneMenu>
                </div>
            </div>
            
            <div class="form-group col-md-12">
                <p:outputLabel value="Fecha Desde: " class=" col-lg-1 col-md-1 control-label"/>      
                <div class="col-lg-3 col-md-3">
                    <p:calendar id="cldFecha" value="#{reporteInventariosControlador.fechaDesde}" pattern="#{formato.formatoFecha}" placeholder="dd/mm/yyyy"/>
                </div>               
            </div>     
            
            <div class="form-group col-md-12">
                <p:outputLabel value="Fecha Hasta: " class=" col-lg-1 col-md-1 control-label"/>      
                <div class="col-lg-3 col-md-3">
                    <p:calendar id="cldFecha2" value="#{reporteInventariosControlador.fechaHasta}" pattern="#{formato.formatoFecha}" placeholder="dd/mm/yyyy"/>
                </div>               
            </div>     

            <p:commandButton value="Generar Reporte" class="btn-xs btn btn-info" 
                             update=":frmInventarios" process="@all"
                             actionListener="#{reporteInventariosControlador.generateReport()}" onclick="start()" oncomplete="cancel()" widgetVar="startButton"  />

            <br /><br />
            <p:progressBar id="progressBarClient" widgetVar="pbClient" style="display:none; font-size: small" labelTemplate="Cargando........Por favor espere"  />
            <p:commandButton value="Descargar PDF"
                             class="btn-xs btn btn-primary"
                             ajax="false"
                             rendered="#{reporteInventariosControlador.media ne null}">
                <p:fileDownload value="#{reporteInventariosControlador.archivoDescarga}"/>
            </p:commandButton>            <p:media class="form-group col-lg-12 col-md-12 col-sm-12 col-xs-12" cache="false" rendered="#{reporteInventariosControlador.media ne null}" width="1400" height="800" value="#{reporteInventariosControlador.media}" player="pdf"/>
  
        </h:form>
      </p:panel>
    

</h:body>
</html>
