<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
   <h:head>
        <link href="#{facesContext.externalContext.context.contextPath}/css/default.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/report-growl.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/tableLayout.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/cssLayout.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/font-awesome.min.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/fonts.googleapis.com.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/ace.min.css" rel="stylesheet" type="text/css" />
        <link href="#{facesContext.externalContext.context.contextPath}/css/ace-rtl.min.css" rel="stylesheet" type="text/css" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    </h:head>
    <script type="text/javascript">
        //<![CDATA[
        function start() {
            window['progress'] = setInterval(function() {
                var pbClient = PF('pbClient'),
                newValue = pbClient.getValue() + 10;

                pbClient.setValue(pbClient.getValue() + 10);

                if(newValue === 100) {
                    clearInterval(window['progress']);
                }
            }, 1000);
        }

        function cancel() {
            clearInterval(window['progress']);
            PF('pbClient').setValue(0);
            PF('startButton1').enable();
        }
        //]]>
    </script>

   <p:panel style="font-size: larger;font-weight: bold; color: #004085" class="form-group col-lg-12 col-md-12 col-sm-12 col-xs-12">
        <h:form id="frmRepSalidaAntesJornada">
            <p:growl id="msgs" styleClass="report-growl" style="position: fixed; top: 95px; right: 30px; width: 390px; z-index: 99999;" showSummary="false" showDetail="true" life="6000" />

            <div class="form-group col-md-12">
                <p:outputLabel value="Direccion/Gestion:" class=" col-lg-1 col-md-1 control-label" />
                <div class="col-lg-3 col-md-3">
                    <p:selectOneMenu id="idGestion"
                                     value="#{reporteSalidaAntesJornadaSemanalControlador.noGestion}"
                                     filter="true"
                                     filterMatchMode="contains">
                        <f:selectItem itemLabel="-- Todas --" itemValue="#{null}" noSelectionOption="true"/>
                        <f:selectItems value="#{reporteSalidaAntesJornadaSemanalControlador.listadoGestiones}" var="itemGestion"
                                       itemLabel="#{itemGestion.descrip}"
                                       itemValue="#{itemGestion.noCd}" />
                    </p:selectOneMenu>
                </div>

                <p:outputLabel value="Codigo:" class=" col-lg-1 col-md-1 control-label"/>
                <div class="col-lg-2 col-md-2">
                    <p:inputText id="txtCodigo"
                                 value="#{reporteSalidaAntesJornadaSemanalControlador.codigo}"
                                 maxlength="20"/>
                </div>
            </div>

            <div class="form-group col-md-12">
                <p:outputLabel value="Fecha Inicio: " class=" col-lg-1 col-md-1 control-label"/>
                <div class="col-lg-2 col-md-2">
                    <p:calendar id="cldFechaInicio"
                                value="#{reporteSalidaAntesJornadaSemanalControlador.fechaDesde}"
                                pattern="#{formato.formatoFecha}"
                                placeholder="dd/mm/yyyy"
                                navigator="true"
                                yearRange="1928:2035"
                                mask="true"
                                showButtonPanel="true"/>
                </div>
                <p:outputLabel value="Fecha Fin: " class=" col-lg-1 col-md-1 control-label"/>
                <div class="col-lg-2 col-md-2">
                    <p:calendar id="cldFechaFin"
                                value="#{reporteSalidaAntesJornadaSemanalControlador.fechaHasta}"
                                pattern="#{formato.formatoFecha}"
                                placeholder="dd/mm/yyyy"
                                navigator="true"
                                yearRange="1928:2035"
                                mask="true"
                                showButtonPanel="true"/>
                </div>
            </div>

            <div class="form-group col-md-12">
                <div class="col-lg-5 col-md-5">
                    <p:commandButton value="Generar reporte de salida antes de 16:30" class="btn-xs btn btn-warning"
                                     update="frmRepSalidaAntesJornada" process="@all"
                                     actionListener="#{reporteSalidaAntesJornadaSemanalControlador.generarReporteSalidaAntesJornadaSemanal()}" onclick="start()" oncomplete="cancel()" widgetVar="startButton1" />
                </div>
            </div>

            <br /><br />
            <p:progressBar id="progressBarClient" widgetVar="pbClient" style=" font-size: small" labelTemplate="Cargando........Por favor espere"  />
            <p:commandButton value="Descargar PDF"
                             class="btn-xs btn btn-primary"
                             ajax="false"
                             rendered="#{reporteSalidaAntesJornadaSemanalControlador.media ne null}">
                <p:fileDownload value="#{reporteSalidaAntesJornadaSemanalControlador.archivoDescarga}"/>
            </p:commandButton>
            <p:media class="form-group col-lg-12 col-md-12 col-sm-12 col-xs-12" cache="false" rendered="#{reporteSalidaAntesJornadaSemanalControlador.media ne null}" width="1400" height="800" value="#{reporteSalidaAntesJornadaSemanalControlador.media}" player="pdf"/>
        </h:form>
      </p:panel>

</html>
